app-id: io.github.gbnanoengineer.LiteHub
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: litehub
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio        # call audio
  - --device=all               # camera for video calls, GPU
  - --filesystem=xdg-download  # downloads folder
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --env=QTWEBENGINE_CHROMIUM_FLAGS=--no-sandbox   # Chromium's own sandbox can't nest inside Flatpak's
modules:
  - name: python-deps
    buildsystem: simple
    build-options:
      build-args:
        - --share=network      # fine for local/CI builds; Flathub would need pinned wheels (flatpak-pip-generator)
    build-commands:
      - pip3 install --target=/app/lib/litehub-deps --no-cache-dir PyQt6 PyQt6-WebEngine
  - name: litehub
    buildsystem: simple
    sources:
      - type: dir
        path: ../..
    build-commands:
      - install -Dm755 src/litehub.py /app/lib/litehub/litehub.py
      - install -Dm755 packaging/flatpak/litehub-launcher.sh /app/bin/litehub
      - install -Dm644 packaging/flatpak/io.github.gbnanoengineer.LiteHub.desktop /app/share/applications/io.github.gbnanoengineer.LiteHub.desktop
      - install -Dm644 packaging/litehub.svg /app/share/icons/hicolor/scalable/apps/io.github.gbnanoengineer.LiteHub.svg
      - install -Dm644 packaging/flatpak/io.github.gbnanoengineer.LiteHub.metainfo.xml /app/share/metainfo/io.github.gbnanoengineer.LiteHub.metainfo.xml
