name: build-packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with: {name: deb, path: build/*.deb}

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y rpm-build desktop-file-utils tar gzip git
      - uses: actions/checkout@v4
      - run: ./build-rpm.sh
      - uses: actions/upload-artifact@v4
        with: {name: rpm, path: build/*.rpm}

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.8
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: tessera.flatpak
          manifest-path: packaging/flatpak/io.github.gbnanoengineer.Tessera.yml
          cache: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm, flatpak]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with: {files: dist/*}
